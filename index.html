<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<meta name="description" content="Convert photos, PDFs, Word, Excel and text files into one merged PDF — on your phone, nothing uploaded.">
<title>PDF Creator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
    </div>
    <div class="titles">
      <h1>PDF Creator</h1>
      <div class="sub">Convert files and merge into one PDF</div>
    </div>
    <button id="btnReset" class="icon-btn hidden" title="Start over" aria-label="Start over">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </header>

  <!-- Step 1: add files -->
  <section id="screenAdd" class="screen active">
    <label id="dropZone" class="drop" for="fileInput">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>
      </div>
      <div class="drop-title">Add files</div>
      <div class="drop-sub">Tap to choose, or drop files here</div>
      <div class="chips">
        <span class="chip">PDF</span><span class="chip">JPG / PNG / WEBP</span><span class="chip">Word .docx</span>
        <span class="chip">Excel .xlsx / CSV</span><span class="chip">Text .txt</span>
      </div>
    </label>
    <input id="fileInput" type="file" multiple hidden
      accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.bmp,.docx,.xlsx,.xls,.csv,.txt,.html,.htm,image/*,application/pdf">
    <p class="note">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Everything happens on this device. Files are never uploaded.
    </p>
  </section>

  <!-- Step 2: confirm sequence -->
  <section id="screenOrder" class="screen">
    <div class="ask card">
      <div class="ask-head">
        <span class="step">Step 2 of 3</span>
        <h2>Is this the right order?</h2>
      </div>
      <p id="askText" class="ask-text"></p>
      <div class="sorts" role="group" aria-label="Sort files">
        <button class="sort active" data-sort="suggested">✨ Suggested</button>
        <button class="sort" data-sort="name">Name A–Z</button>
        <button class="sort" data-sort="upload">As added</button>
        <button class="sort" data-sort="date">Oldest first</button>
        <button class="sort" data-sort="type">By type</button>
      </div>
    </div>

    <ol id="list" class="list"></ol>

    <button id="btnAddMore" class="ghost">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add more files
    </button>

    <div class="card options">
      <h3>Options</h3>
      <label class="field">
        <span>File name</span>
        <div class="with-suffix"><input id="outName" type="text" value="Merged" autocomplete="off"><em>.pdf</em></div>
      </label>
      <div class="field">
        <span>Photo pages</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="pageMode" value="a4" checked><b>Fit on A4</b></label>
          <label><input type="radio" name="pageMode" value="original"><b>Original size</b></label>
        </div>
      </div>
      <div class="field">
        <span>Photo quality</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="quality" value="small"><b>Smaller file</b></label>
          <label><input type="radio" name="quality" value="high" checked><b>High</b></label>
        </div>
      </div>
    </div>
  </section>

  <!-- Step 3: result -->
  <section id="screenDone" class="screen">
    <div class="card done">
      <div class="done-icon">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>
      </div>
      <h2>Your PDF is ready</h2>
      <p id="doneMeta" class="muted"></p>
      <div id="doneWarn" class="warn hidden"></div>
      <div class="done-actions">
        <button id="btnDownload" class="primary">Download PDF</button>
        <button id="btnShare" class="secondary hidden">Share</button>
        <button id="btnOpen" class="secondary">Open</button>
      </div>
      <div class="done-links">
        <button id="btnBack" class="link">← Change order</button>
        <button id="btnNew" class="link">Start a new PDF</button>
      </div>
    </div>
  </section>

  <footer id="bar" class="bar hidden">
    <div class="bar-info"><b id="barCount">0 files</b><span id="barPages"></span></div>
    <button id="btnCreate" class="primary">Create PDF</button>
  </footer>
</div>

<div id="busy" class="busy hidden" role="status" aria-live="polite">
  <div class="busy-card">
    <div class="spinner"></div>
    <div id="busyTitle" class="busy-title">Working…</div>
    <div id="busySub" class="busy-sub"></div>
    <div class="progress"><i id="busyBar"></i></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<!-- off-screen stage used to render Word / Excel / text pages -->
<div id="stage" aria-hidden="true"></div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
